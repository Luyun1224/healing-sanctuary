name: Deploy to GitHub Pages

on:
  push:
    # 目前 repository 只有開發分支；建立 main 後兩者皆可觸發部署
    branches: [main, claude/magical-davinci-xqpchy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 多人同步 API（Google Apps Script Web App 網址）：repo Settings → Secrets and variables → Actions → Variables → GAS_URL
          VITE_GAS_URL: ${{ vars.GAS_URL }}
      # GitHub Pages 對未知路徑回傳 404.html；本站使用 Hash Router，直接複製首頁即可
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
